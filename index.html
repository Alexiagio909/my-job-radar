<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Job Radar</title>
  
  <!-- Google Fonts: Montserrat & JetBrains Mono for live query code preview -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       CSS Variables & Reset
       ========================================================================== */
    :root {
      --bg-color: #ffffff;
      --surface-color: #f8f9fc;
      --surface-hover: #f1f4f9;
      --border-color: #e2e8f0;
      --border-focus: #1A33FF;
      --primary: #1A33FF;
      --primary-hover: #1226cc;
      --primary-light: rgba(26, 51, 255, 0.08);
      --primary-ring: rgba(26, 51, 255, 0.2);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 16px -2px rgba(15, 23, 42, 0.06);
      --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding: 24px 16px 64px;
    }

    /* ==========================================================================
       Layout Container
       ========================================================================== */
    .container {
      max-width: 780px;
      margin: 0 auto;
    }

    /* ==========================================================================
       Header
       ========================================================================== */
    header {
      text-align: center;
      margin-bottom: 36px;
      padding-top: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--primary-light);
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .radar-dot {
      width: 8px;
      height: 8px;
      background-color: var(--primary);
      border-radius: 50%;
      display: inline-block;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(26, 51, 255, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(26, 51, 255, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(26, 51, 255, 0); }
    }

    h1 {
      font-size: clamp(1.85rem, 4vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    h1 span {
      color: var(--primary);
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      max-width: 540px;
      margin: 0 auto;
      font-weight: 400;
    }

    /* ==========================================================================
       Main Form Card
       ========================================================================== */
    .card {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 28px;
      box-shadow: var(--shadow-md);
    }

    @media (max-width: 600px) {
      .card {
        padding: 20px 16px;
      }
    }

    .section-group {
      margin-bottom: 24px;
    }

    .section-group:last-child {
      margin-bottom: 0;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 640px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    label.field-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .label-hint {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    input[type="text"],
    select {
      width: 100%;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text-main);
      background-color: var(--bg-color);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      transition: var(--transition);
      outline: none;
    }

    input[type="text"]::placeholder {
      color: var(--text-light);
      font-weight: 400;
    }

    input[type="text"]:focus,
    select:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--primary-ring);
    }

    /* ==========================================================================
       Posted Filter Pills (Segmented Control)
       ========================================================================== */
    .pill-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background-color: var(--surface-color);
      padding: 6px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }

    @media (max-width: 520px) {
      .pill-group {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .pill-option {
      position: relative;
    }

    .pill-option input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .pill-option label {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 9px 10px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      text-align: center;
      user-select: none;
    }

    .pill-option input[type="radio"]:checked + label {
      background-color: var(--primary);
      color: #ffffff;
      box-shadow: var(--shadow-sm);
    }

    .pill-option input[type="radio"]:not(:checked) + label:hover {
      background-color: var(--surface-hover);
      color: var(--text-main);
    }

    /* ==========================================================================
       Career Sites Checkboxes
       ========================================================================== */
    .sites-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .text-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: var(--transition);
    }

    .text-btn:hover {
      background-color: var(--primary-light);
    }

    .sites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 10px;
    }

    .site-checkbox {
      position: relative;
    }

    .site-checkbox input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .site-checkbox label {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      transition: var(--transition);
      user-select: none;
      background: var(--bg-color);
    }

    .site-checkbox label:hover {
      border-color: #cbd5e1;
      background: var(--surface-color);
    }

    .custom-check {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      border: 1.5px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: var(--transition);
      background: #fff;
    }

    .custom-check svg {
      width: 12px;
      height: 12px;
      stroke: #ffffff;
      stroke-width: 3;
      fill: none;
      opacity: 0;
      transform: scale(0.8);
      transition: var(--transition);
    }

    .site-checkbox input[type="checkbox"]:checked + label {
      border-color: var(--primary);
      background-color: var(--primary-light);
      color: var(--primary);
    }

    .site-checkbox input[type="checkbox"]:checked + label .custom-check {
      background-color: var(--primary);
      border-color: var(--primary);
    }

    .site-checkbox input[type="checkbox"]:checked + label .custom-check svg {
      opacity: 1;
      transform: scale(1);
    }

    /* ==========================================================================
       Search Engine Selector
       ========================================================================== */
    .engine-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .engine-option {
      position: relative;
    }

    .engine-option input[type="radio"] {
      position: absolute;
      opacity: 0;
    }

    .engine-option label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
    }

    .engine-option input[type="radio"]:checked + label {
      border-color: var(--primary);
      background-color: var(--primary-light);
      color: var(--primary);
    }

    /* ==========================================================================
       Live Query Preview Box
       ========================================================================== */
    .preview-box {
      background-color: var(--surface-color);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-top: 28px;
    }

    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .preview-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: var(--transition);
    }

    .copy-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .query-output {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      line-height: 1.6;
      color: var(--text-main);
      word-break: break-word;
      background: #ffffff;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      min-height: 52px;
    }

    /* ==========================================================================
       Action Buttons
       ========================================================================== */
    .actions {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 12px;
      margin-top: 24px;
    }

    @media (max-width: 580px) {
      .actions {
        grid-template-columns: 1fr;
      }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 15px 20px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: var(--transition);
      border: none;
      text-decoration: none;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(26, 51, 255, 0.25);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(26, 51, 255, 0.32);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background-color: #ffffff;
      color: var(--primary);
      border: 1.5px solid var(--primary);
    }

    .btn-secondary:hover {
      background-color: var(--primary-light);
      transform: translateY(-1px);
    }

    .btn-secondary:active {
      transform: translateY(0);
    }

    /* ==========================================================================
       Toast Notification (Replaces alert)
       ========================================================================== */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background-color: var(--text-main);
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ==========================================================================
       Footer
       ========================================================================== */
    footer {
      text-align: center;
      margin-top: 32px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="badge">
        <span class="radar-dot"></span>
        Direct ATS Search Engine
      </div>
      <h1>My Job <span>Radar</span></h1>
      <p class="subtitle">Bypass bloated job boards. Search directly across company career portals and uncover hiring teams in seconds.</p>
    </header>

    <!-- Main Builder Card -->
    <main class="card">
      <!-- Job Titles & Location -->
      <div class="section-group grid-2">
        <div>
          <label class="field-label" for="jobTitles">
            Job Titles
            <span class="label-hint">Comma separated</span>
          </label>
          <input 
            type="text" 
            id="jobTitles" 
            placeholder="e.g. Product Manager, UX Designer" 
            value="Product Manager, Senior Product Manager"
            autocomplete="off"
          />
        </div>

        <div>
          <label class="field-label" for="location">
            Location / Remote
            <span class="label-hint">Optional</span>
          </label>
          <input 
            type="text" 
            id="location" 
            placeholder="e.g. Remote, New York, London" 
            value="Remote"
            autocomplete="off"
          />
        </div>
      </div>

      <!-- Posted Date Filter -->
      <div class="section-group">
        <label class="field-label">
          Posted Timeframe
        </label>
        <div class="pill-group" role="radiogroup" aria-label="Posted timeframe">
          <div class="pill-option">
            <input type="radio" name="posted" id="posted-any" value="any">
            <label for="posted-any">Any time</label>
          </div>
          <div class="pill-option">
            <input type="radio" name="posted" id="posted-day" value="day">
            <label for="posted-day">Past 24 hours</label>
          </div>
          <div class="pill-option">
            <input type="radio" name="posted" id="posted-week" value="week" checked>
            <label for="posted-week">Past week</label>
          </div>
          <div class="pill-option">
            <input type="radio" name="posted" id="posted-month" value="month">
            <label for="posted-month">Past month</label>
          </div>
        </div>
      </div>

      <!-- Career Sites (ATS) -->
      <div class="section-group">
        <div class="sites-header">
          <label class="field-label" style="margin-bottom: 0;">Career Sites (ATS)</label>
          <button type="button" class="text-btn" id="toggleAllSites">Deselect all</button>
        </div>

        <div class="sites-grid" id="sitesContainer">
          <!-- Checkboxes populated cleanly via HTML with domain data attributes -->
          <div class="site-checkbox">
            <input type="checkbox" id="site-greenhouse" value="boards.greenhouse.io" checked>
            <label for="site-greenhouse">
              <span class="custom-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
              Greenhouse
            </label>
          </div>

          <div class="site-checkbox">
            <input type="checkbox" id="site-lever" value="jobs.lever.co" checked>
            <label for="site-lever">
              <span class="custom-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
              Lever
            </label>
          </div>

          <div class="site-checkbox">
            <input type="checkbox" id="site-ashby" value="jobs.ashbyhq.com" checked>
            <label for="site-ashby">
              <span class="custom-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
              Ashby
            </label>
          </div>

          <div class="site-checkbox">
            <input type="checkbox" id="site-workable" value="apply.workable.com" checked>
            <label for="site-workable">
              <span class="custom-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
              Workable
            </label>
          </div>

          <div class="site-checkbox">
            <input type="checkbox" id="site-teamtailor" value="teamtailor.com">
            <label for="site-teamtailor">
              <span class="custom-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
              Teamtailor
            </label>
          </div>

          <div class="site-checkbox">
            <input type="checkbox" id="site-smartrecruiters" value="jobs.smartrecruiters.com">
            <label for="site-smartrecruiters">
              <span class="custom-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
              SmartRecruiters
            </label>
          </div>

          <div class="site-checkbox">
            <input type="checkbox" id="site-workday" value="myworkdayjobs.com">
            <label for="site-workday">
              <span class="custom-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
              Workday
            </label>
          </div>

          <div class="site-checkbox">
            <input type="checkbox" id="site-wttj" value="welcometothejungle.com">
            <label for="site-wttj">
              <span class="custom-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
              Welcome to the Jungle
            </label>
          </div>
        </div>
      </div>

      <!-- Optional Include / Exclude Words -->
      <div class="section-group grid-2">
        <div>
          <label class="field-label" for="includeWords">
            Include Words
            <span class="label-hint">Optional (comma separated)</span>
          </label>
          <input 
            type="text" 
            id="includeWords" 
            placeholder="e.g. B2B, SaaS, AI" 
            autocomplete="off"
          />
        </div>

        <div>
          <label class="field-label" for="excludeWords">
            Exclude Words
            <span class="label-hint">Optional (comma separated)</span>
          </label>
          <input 
            type="text" 
            id="excludeWords" 
            placeholder="e.g. Intern, Junior, Director" 
            autocomplete="off"
          />
        </div>
      </div>

      <!-- Search Engine Choice -->
      <div class="section-group">
        <label class="field-label">Search Engine</label>
        <div class="engine-group" role="radiogroup" aria-label="Search engine choice">
          <div class="engine-option">
            <input type="radio" name="engine" id="engine-google" value="google" checked>
            <label for="engine-google">Google</label>
          </div>
          <div class="engine-option">
            <input type="radio" name="engine" id="engine-bing" value="bing">
            <label for="engine-bing">Bing</label>
          </div>
          <div class="engine-option">
            <input type="radio" name="engine" id="engine-ddg" value="ddg">
            <label for="engine-ddg">DuckDuckGo</label>
          </div>
        </div>
      </div>

      <!-- Live Search Query Preview -->
      <div class="preview-box">
        <div class="preview-header">
          <span class="preview-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
            Live Boolean Query Preview
          </span>
          <button type="button" class="copy-btn" id="copyQueryBtn" title="Copy query to clipboard">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            Copy
          </button>
        </div>
        <div class="query-output" id="queryPreview" aria-live="polite"></div>
      </div>

      <!-- Primary & Secondary Action Buttons -->
      <div class="actions">
        <button type="button" class="btn btn-primary" id="findJobsBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          Find jobs
        </button>

        <button type="button" class="btn btn-secondary" id="findHiringTeamBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          Hiring team on LinkedIn
        </button>
      </div>
    </main>

    <footer>
      My Job Radar &bull; Direct X-Ray Boolean Job Search
    </footer>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">Query copied to clipboard!</div>

  <script>
    /**
     * My Job Radar - Core Logic
     * Dynamically constructs boolean X-ray search queries for ATS job boards
     * and LinkedIn hiring managers/recruiters.
     */
    (function () {
      // DOM Elements
      const jobTitlesInput = document.getElementById('jobTitles');
      const locationInput = document.getElementById('location');
      const includeWordsInput = document.getElementById('includeWords');
      const excludeWordsInput = document.getElementById('excludeWords');
      const postedRadios = document.querySelectorAll('input[name="posted"]');
      const engineRadios = document.querySelectorAll('input[name="engine"]');
      const siteCheckboxes = document.querySelectorAll('#sitesContainer input[type="checkbox"]');
      const toggleAllBtn = document.getElementById('toggleAllSites');
      const queryPreviewEl = document.getElementById('queryPreview');
      const copyQueryBtn = document.getElementById('copyQueryBtn');
      const findJobsBtn = document.getElementById('findJobsBtn');
      const findHiringTeamBtn = document.getElementById('findHiringTeamBtn');
      const toastEl = document.getElementById('toast');

      /**
       * Helper to parse comma-separated strings into clean, trimmed tokens
       */
      function parseList(str) {
        return str
          .split(',')
          .map(item => item.trim())
          .filter(item => item.length > 0);
      }

      /**
       * Wrap phrase in quotes if it contains spaces and isn't already quoted
       */
      function formatTerm(term) {
        if (term.startsWith('"') && term.endsWith('"')) return term;
        return term.includes(' ') ? `"${term}"` : term;
      }

      /**
       * Get currently selected radio value
       */
      function getSelectedRadio(nodeList) {
        for (const radio of nodeList) {
          if (radio.checked) return radio.value;
        }
        return null;
      }

      /**
       * Build the ATS Boolean Search Query string
       */
      function buildJobQuery() {
        const parts = [];

        // 1. Career Sites (site:a OR site:b)
        const selectedSites = Array.from(siteCheckboxes)
          .filter(cb => cb.checked)
          .map(cb => `site:${cb.value}`);

        if (selectedSites.length > 0) {
          parts.push(
            selectedSites.length === 1
              ? selectedSites[0]
              : `(${selectedSites.join(' OR ')})`
          );
        }

        // 2. Job Titles ("Title 1" OR "Title 2")
        const titles = parseList(jobTitlesInput.value).map(formatTerm);
        if (titles.length > 0) {
          parts.push(
            titles.length === 1
              ? titles[0]
              : `(${titles.join(' OR ')})`
          );
        }

        // 3. Location
        const location = locationInput.value.trim();
        if (location) {
          // Support comma-separated locations as OR, or single location
          const locs = parseList(location).map(formatTerm);
          parts.push(
            locs.length === 1
              ? locs[0]
              : `(${locs.join(' OR ')})`
          );
        }

        // 4. Include Words
        const includes = parseList(includeWordsInput.value).map(formatTerm);
        if (includes.length > 0) {
          parts.push(includes.join(' '));
        }

        // 5. Exclude Words
        const excludes = parseList(excludeWordsInput.value).map(term => `-${formatTerm(term)}`);
        if (excludes.length > 0) {
          parts.push(excludes.join(' '));
        }

        return parts.join(' ');
      }

      /**
       * Build the LinkedIn Hiring Team X-Ray Search Query
       */
      function buildHiringTeamQuery() {
        const parts = ['site:linkedin.com/in'];

        // Hiring roles
        parts.push('("Recruiter" OR "Talent Acquisition" OR "Hiring Manager" OR "Head of Talent" OR "People Partner")');

        // Relevant job titles / department keywords
        const titles = parseList(jobTitlesInput.value).map(formatTerm);
        if (titles.length > 0) {
          parts.push(
            titles.length === 1
              ? titles[0]
              : `(${titles.join(' OR ')})`
          );
        }

        // Location if provided
        const location = locationInput.value.trim();
        if (location) {
          const locs = parseList(location).map(formatTerm);
          parts.push(
            locs.length === 1
              ? locs[0]
              : `(${locs.join(' OR ')})`
          );
        }

        // Include words (e.g., company name or industry)
        const includes = parseList(includeWordsInput.value).map(formatTerm);
        if (includes.length > 0) {
          parts.push(includes.join(' '));
        }

        return parts.join(' ');
      }

      /**
       * Construct Search Engine URL with query and date filters
       */
      function buildSearchUrl(query, applyDateFilter = true) {
        const engine = getSelectedRadio(engineRadios);
        const posted = getSelectedRadio(postedRadios);
        const encodedQuery = encodeURIComponent(query);

        if (engine === 'bing') {
          let url = `https://www.bing.com/search?q=${encodedQuery}`;
          if (applyDateFilter && posted !== 'any') {
            // Bing freshness filters: ez1 (24h), ez2 (7d), ez3 (30d)
            const bingMap = { day: 'ez1', week: 'ez2', month: 'ez3' };
            if (bingMap[posted]) {
              url += `&filters=ex1%3a%22${bingMap[posted]}%22`;
            }
          }
          return url;
        }

        if (engine === 'ddg') {
          let url = `https://duckduckgo.com/?q=${encodedQuery}`;
          if (applyDateFilter && posted !== 'any') {
            // DuckDuckGo date filter: df=d (day), df=w (week), df=m (month)
            const ddgMap = { day: 'd', week: 'w', month: 'm' };
            if (ddgMap[posted]) {
              url += `&df=${ddgMap[posted]}`;
            }
          }
          return url;
        }

        // Default: Google
        let url = `https://www.google.com/search?q=${encodedQuery}`;
        if (applyDateFilter && posted !== 'any') {
          // Google tbs=qdr:d (day), qdr:w (week), qdr:m (month)
          const googleMap = { day: 'd', week: 'w', month: 'm' };
          if (googleMap[posted]) {
            url += `&tbs=qdr:${googleMap[posted]}`;
          }
        }
        return url;
      }

      /**
       * Update Live Preview UI & Toggle Button State
       */
      function updateUI() {
        const query = buildJobQuery();
        queryPreviewEl.textContent = query || 'Enter a job title or select a career site to generate your search query...';

        // Update Select/Deselect all button text
        const allChecked = Array.from(siteCheckboxes).every(cb => cb.checked);
        toggleAllBtn.textContent = allChecked ? 'Deselect all' : 'Select all';
      }

      /**
       * Show brief non-blocking toast message
       */
      let toastTimeout;
      function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toastEl.classList.remove('show');
        }, 2400);
      }

      // ========================================================================
      // Event Listeners
      // ========================================================================
      [jobTitlesInput, locationInput, includeWordsInput, excludeWordsInput].forEach(input => {
        input.addEventListener('input', updateUI);
      });

      siteCheckboxes.forEach(cb => {
        cb.addEventListener('change', updateUI);
      });

      postedRadios.forEach(radio => {
        radio.addEventListener('change', updateUI);
      });

      engineRadios.forEach(radio => {
        radio.addEventListener('change', updateUI);
      });

      // Toggle All Career Sites
      toggleAllBtn.addEventListener('click', () => {
        const allChecked = Array.from(siteCheckboxes).every(cb => cb.checked);
        siteCheckboxes.forEach(cb => {
          cb.checked = !allChecked;
        });
        updateUI();
      });

      // Copy Query to Clipboard (using safe textarea fallback for iframes)
      copyQueryBtn.addEventListener('click', () => {
        const textToCopy = buildJobQuery();
        if (!textToCopy) {
          showToast('Nothing to copy yet');
          return;
        }
        const tempTextarea = document.createElement('textarea');
        tempTextarea.value = textToCopy;
        tempTextarea.style.position = 'fixed';
        tempTextarea.style.opacity = '0';
        document.body.appendChild(tempTextarea);
        tempTextarea.select();
        try {
          document.execCommand('copy');
          showToast('Search query copied to clipboard');
        } catch (err) {
          showToast('Unable to copy query');
        }
        document.body.removeChild(tempTextarea);
      });

      // Primary Action: Find Jobs
      findJobsBtn.addEventListener('click', () => {
        const query = buildJobQuery();
        if (!query) {
          showToast('Please enter a job title or select a career site');
          jobTitlesInput.focus();
          return;
        }
        const url = buildSearchUrl(query, true);
        window.open(url, '_blank', 'noopener,noreferrer');
      });

      // Secondary Action: Search LinkedIn Hiring Team
      findHiringTeamBtn.addEventListener('click', () => {
        const query = buildHiringTeamQuery();
        // Do not apply strict 24h/week date filter to LinkedIn profile X-ray search
        const url = buildSearchUrl(query, false);
        window.open(url, '_blank', 'noopener,noreferrer');
      });

      // Allow pressing Enter inside text inputs to trigger "Find jobs"
      [jobTitlesInput, locationInput, includeWordsInput, excludeWordsInput].forEach(input => {
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            findJobsBtn.click();
          }
        });
      });

      // Initial render
      updateUI();
    })();
  </script>
</body>
</html>
